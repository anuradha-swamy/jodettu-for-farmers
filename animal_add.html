<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Animal - Jodettu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .image-section {
            border: 2px dashed #e1e5e9;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            background: #f8f9fa;
            margin-bottom: 25px;
        }

        .image-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            margin-top: 15px;
        }

        .upload-area:hover {
            background: #f8f9ff;
            border-color: #5a6fd8;
        }

        .upload-area.dragover {
            background: #e8f4f8;
            border-color: #28a745;
        }

        .file-input {
            display: none;
        }

        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .preview-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .preview-item .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 12px;
        }

        .preview-item .file-info {
            padding: 8px;
            background: white;
            font-size: 12px;
            color: #666;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐄 Add New Animal</h1>
            <p>Register a new animal and upload images/documents</p>
        </div>

        <div class="form-container">
            <div id="message" class="message"></div>
            
            <form id="addAnimalForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="animalType">Animal Type *</label>
                        <select id="animalType" name="animalType" required>
                            <option value="">Select Type</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="animalBreed">Breed *</label>
                        <select id="animalBreed" name="animalBreed" required>
                            <option value="">Select Breed</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="animalName">Animal Name *</label>
                        <input type="text" id="animalName" name="animalName" required placeholder="Enter animal name">
                    </div>
                    
                    <div class="form-group">
                        <label for="animalAge">Age (years) *</label>
                        <input type="number" id="animalAge" name="animalAge" min="0" required placeholder="Enter age">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="animalHeight">Height (cm) *</label>
                        <input type="number" id="animalHeight" name="animalHeight" step="0.1" min="0" required placeholder="Enter height">
                    </div>
                    
                    <div class="form-group">
                        <label for="animalWeight">Weight (kg) *</label>
                        <input type="number" id="animalWeight" name="animalWeight" step="0.1" min="0" required placeholder="Enter weight">
                    </div>
                </div>

                <div class="form-group">
                    <label for="lastVaccination">Last Vaccination Date *</label>
                    <input type="datetime-local" id="lastVaccination" name="lastVaccination" required>
                </div>

                <div class="form-group">
                    <label for="animalDescription">Description</label>
                    <textarea id="animalDescription" name="animalDescription" rows="4" placeholder="Enter any additional information about the animal..."></textarea>
                </div>

                <!-- Images/Documents Section -->
                <div class="image-section">
                    <h3>📸 Upload Images/Documents</h3>
                    <div class="upload-area" onclick="document.getElementById('animalImages').click()">
                        <p>📸 Click to upload images or drag & drop</p>
                        <p style="font-size: 12px; color: #666; margin-top: 10px;">Supports: JPG, PNG, PDF, DOC (Max 10MB per file)</p>
                        <p style="font-size: 12px; color: #666;">You can upload multiple files</p>
                    </div>
                    <input type="file" id="animalImages" class="file-input" multiple accept="image/*,.pdf,.doc,.docx">
                    <div id="imagePreview" class="image-preview"></div>
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary">💾 Add Animal</button>
                    <button type="button" class="btn btn-secondary" onclick="window.history.back()">❌ Cancel</button>
                </div>
            </form>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Adding animal...</p>
            </div>
        </div>
    </div>

    <script>
        let uploadedFiles = [];

        // Load animal types
        async function loadAnimalTypes() {
            try {
                const token = localStorage.getItem('token') || 'demo_token';
                const response = await fetch('/Jodettu/Animals/animal-types', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load animal types');

                const types = await response.json();
                const select = document.getElementById('animalType');
                select.innerHTML = '<option value="">Select Type</option>' +
                    types.map(type => `<option value="${type}">${type}</option>`).join('');

            } catch (error) {
                console.error('Error loading animal types:', error);
                showMessage('Error loading animal types', 'error');
            }
        }

        // Load breeds for selected animal type
        async function loadBreeds(animalType) {
            if (!animalType) {
                document.getElementById('animalBreed').innerHTML = '<option value="">Select Breed</option>';
                return;
            }

            try {
                const token = localStorage.getItem('token') || 'demo_token';
                const response = await fetch(`/Jodettu/Animals/breeds/${animalType}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load breeds');

                const breeds = await response.json();
                const select = document.getElementById('animalBreed');
                select.innerHTML = '<option value="">Select Breed</option>' +
                    breeds.map(breed => `<option value="${breed}">${breed}</option>`).join('');

            } catch (error) {
                console.error('Error loading breeds:', error);
                showMessage('Error loading breeds', 'error');
            }
        }

        // Handle file selection
        document.getElementById('animalImages').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            handleFiles(files);
        });

        // Handle drag and drop
        const uploadArea = document.querySelector('.upload-area');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            handleFiles(files);
        });

        // Handle files
        function handleFiles(files) {
            const validFiles = files.filter(file => {
                const isValidType = file.type.startsWith('image/') || file.type === 'application/pdf' || 
                                  file.type === 'application/msword' || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
                const isValidSize = file.size <= 10 * 1024 * 1024; // 10MB
                
                if (!isValidType) {
                    showMessage(`${file.name} is not a valid file type`, 'error');
                    return false;
                }
                if (!isValidSize) {
                    showMessage(`${file.name} is larger than 10MB`, 'error');
                    return false;
                }
                return true;
            });

            uploadedFiles.push(...validFiles);
            displayFiles();
        }

        // Display uploaded files
        function displayFiles() {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = uploadedFiles.map((file, index) => {
                const isImage = file.type.startsWith('image/');
                const previewUrl = isImage ? URL.createObjectURL(file) : 'https://via.placeholder.com/150x150?text=Document';
                
                return `
                    <div class="preview-item">
                        <button type="button" class="remove-btn" onclick="removeFile(${index})">×</button>
                        <img src="${previewUrl}" alt="${file.name}">
                        <div class="file-info">${file.name}</div>
                    </div>
                `;
            }).join('');
        }

        // Remove file
        function removeFile(index) {
            uploadedFiles.splice(index, 1);
            displayFiles();
        }

        // Handle animal type change
        document.getElementById('animalType').addEventListener('change', function() {
            loadBreeds(this.value);
        });

        // Handle form submission
        document.getElementById('addAnimalForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const loading = document.getElementById('loading');
            loading.classList.add('show');

            try {
                const formData = new FormData();
                
                // Add form fields
                formData.append('own_animal_type', document.getElementById('animalType').value);
                formData.append('own_animal_breed', document.getElementById('animalBreed').value);
                formData.append('own_animal_name', document.getElementById('animalName').value);
                formData.append('own_animal_age', document.getElementById('animalAge').value);
                formData.append('own_animal_height', document.getElementById('animalHeight').value);
                formData.append('own_animal_weight', document.getElementById('animalWeight').value);
                formData.append('own_animal_last_vacc', document.getElementById('lastVaccination').value);
                formData.append('own_animal_desc', document.getElementById('animalDescription').value);

                // Add uploaded files
                uploadedFiles.forEach(file => {
                    formData.append('files', file);
                });

                const token = localStorage.getItem('token') || 'demo_token';
                const response = await fetch('/Jodettu/Animals/add-animal', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `Failed to add animal: ${response.statusText}`);
                }

                const result = await response.json();
                showMessage('Animal added successfully!', 'success');
                
                // Reset form
                document.getElementById('addAnimalForm').reset();
                uploadedFiles = [];
                displayFiles();
                
                // Optionally redirect to animals list
                setTimeout(() => {
                    window.location.href = 'animals.html';
                }, 2000);

            } catch (error) {
                showMessage(`Error adding animal: ${error.message}`, 'error');
            } finally {
                loading.classList.remove('show');
            }
        });

        // Show message
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type} show`;
            
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 5000);
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadAnimalTypes();
            
            // Set default vaccination date to today
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('lastVaccination').value = now.toISOString().slice(0, 16);
        });
    </script>
</body>
</html>
